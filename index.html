<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udvash · Alif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            color: #ffffff;
            text-align: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* main headline */
        .hack-text {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.3;
            text-shadow: 0 0 12px rgba(255, 50, 50, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            word-break: break-word;
        }

        /* image card */
        .picture-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .alif-image {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 70, 70, 0.4), 0 0 8px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            display: block;
            background: #111;
            object-fit: cover;
            aspect-ratio: 1/1;
        }

        .alif-image:hover {
            border-color: #ff4d4d;
            box-shadow: 0 0 45px #ff3b3b, 0 0 15px rgba(255, 255, 255, 0.3);
            transform: scale(1.01);
        }

        .image-caption {
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* button */
        .btn-enter {
            display: inline-block;
            background: transparent;
            color: white;
            font-weight: 600;
            font-size: 1.25rem;
            padding: 0.9rem 2.5rem;
            border: 2px solid #ffffff;
            border-radius: 60px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            margin: 0.25rem 0;
            word-break: break-word;
            max-width: 100%;
        }

        .btn-enter:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.7);
            transform: scale(1.02);
        }

        .btn-enter:active {
            transform: scale(0.98);
        }

        /* instruction text */
        .instruction {
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.6;
            color: #e0e0e0;
            background: rgba(20, 20, 20, 0.75);
            padding: 1.2rem 2rem;
            border-radius: 40px;
            border: 1px solid #2a2a2a;
            backdrop-filter: blur(2px);
            max-width: 100%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .instruction strong {
            color: #ff8a8a;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
        }

        /* small footer (optional) */
        .footer-note {
            font-size: 0.75rem;
            color: #3a3a3a;
            margin-top: 1rem;
            letter-spacing: 1px;
        }

        /* responsive */
        @media (max-width: 540px) {
            .hack-text {
                font-size: 1.7rem;
            }
            .instruction {
                font-size: 1rem;
                padding: 1rem 1.2rem;
            }
            .btn-enter {
                font-size: 1rem;
                padding: 0.75rem 1.5rem;
            }
            .alif-image {
                max-width: 150px;
            }
        }

        @media (max-width: 360px) {
            .hack-text {
                font-size: 1.4rem;
            }
            .instruction {
                font-size: 0.9rem;
            }
        }

        /* fallback for broken image */
        .image-fallback {
            display: none;
            color: #ff6b6b;
            font-size: 0.85rem;
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 30px;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Heading -->
        <h1 class="hack-text">Udvash is hacked by Alif</h1>

        <!-- Picture: alif.png -->
        <div class="picture-wrapper">
            <img 
                src="alif.png" 
                alt="Alif — Udvash hacked" 
                class="alif-image"
                onerror="this.style.display='none'; document.getElementById('imageFallback').style.display='block';"
            >
            <div id="imageFallback" class="image-fallback">⚠️ alif.png not found — but Alif is here.</div>
            <span class="image-caption">ALIF</span>
        </div>

        <!-- Button linking to Udvash app interface -->
        <a 
            href="https://umsdmpreact-3.udvash-unmesh.com/" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="btn-enter"
        >
            Enter Udvash App interface
        </a>

        <!-- Instructions -->
        <div class="instruction">
            Login to the udvash app interface &amp; go to class from <strong>source-1</strong> &amp; then download all the classes
        </div>

        <!-- subtle footer (not required, but adds polish) -->
        <div class="footer-note">⚡ Hacked with CHC skills ⚡</div>
    </div>
</body>
</html>
